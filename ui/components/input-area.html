<script>
  // Add toggle logic for autopilot
  (() => {
    const input = document.getElementById("autopilot-toggle");
    const track = document.getElementById("autopilot-track");
    const thumb = document.getElementById("autopilot-thumb");
    function updateToggle() {
      if (input.checked) {
        track.classList.add("bg-[#474747]");
        track.classList.remove("bg-gray-600");
        thumb.style.transform = "translateX(20px)";
      } else {
        track.classList.remove("bg-[#474747]");
        track.classList.add("bg-gray-600");
        thumb.style.transform = "translateX(0)";
      }
    }
    if (input) {
      input.addEventListener("change", updateToggle);
      updateToggle();
    }
  })();
</script>
<script>
  // Autosize textarea while allowing the container to grow until 1000px
  (() => {
    const textarea = document.getElementById("inputTextArea");
    const container = document.querySelector(".input-area");
    if (!textarea || !container) return;

    const maxContainerHeight = 250; // px

    function resize() {
      textarea.style.height = "auto";
      const taHeight = textarea.scrollHeight;

      // compute available space inside the container: we only grow the textarea while
      // the container height is less than maxContainerHeight
      const containerRect = container.getBoundingClientRect();
      const currentContainerHeight = containerRect.height;

      if (currentContainerHeight < maxContainerHeight) {
        // set textarea to its scrollHeight so it expands
        textarea.style.height = taHeight + "px";
        // after expanding, if container exceeds max, lock textarea and enable container scroll
        if (container.getBoundingClientRect().height > maxContainerHeight) {
          textarea.style.height =
            taHeight -
            (container.getBoundingClientRect().height - maxContainerHeight) +
            "px";
        }
      } else {
        // container already at max - cap textarea and allow scrolling
        textarea.style.height = Math.min(taHeight, 200) + "px";
      }
    }

    textarea.addEventListener("input", resize);
    // initial resize
    setTimeout(resize, 0);
  })();

  // Input area functionality - simplified to work with webview-client.js
  (() => {
    const sendBtn = document.getElementById("send-btn");
    const attachBtn = document.getElementById("attachFileBtn");
    const workingIndicator = document.getElementById("working-indicator");

    let selectedFiles = [];
    let isWorking = false;

    function setWorkingState(working) {
      isWorking = working;
      const sendIcon = document.getElementById("send-icon");
      const loadingIcon = document.getElementById("loading-icon");

      if (working) {
        workingIndicator.classList.remove("hidden");
        workingIndicator.classList.add("flex");
        if (sendBtn) {
          sendBtn.disabled = true;
          sendBtn.style.opacity = "0.6";
        }

        // Switch to loading icon
        if (sendIcon) sendIcon.classList.add("hidden");
        if (loadingIcon) loadingIcon.classList.remove("hidden");
      } else {
        workingIndicator.classList.add("hidden");
        workingIndicator.classList.remove("flex");
        if (sendBtn) {
          sendBtn.disabled = false;
          sendBtn.style.opacity = "1";
        }

        // Switch back to send icon
        if (sendIcon) sendIcon.classList.remove("hidden");
        if (loadingIcon) loadingIcon.classList.add("hidden");
      }
    }

    if (attachBtn) {
      attachBtn.addEventListener("click", () => {
        try {
          const vscode =
            typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : null;
          if (vscode) {
            vscode.postMessage({ command: "selectFiles" });
          }
        } catch (e) {
          console.error("File selection failed:", e);
        }
      });
    }

    // Listen for file selection and working state changes
    window.addEventListener("message", (event) => {
      const message = event.data;
      if (message.command === "filesSelected") {
        selectedFiles = message.files || [];
        // Update button title to show file count
        if (attachBtn && selectedFiles.length > 0) {
          attachBtn.title = `${selectedFiles.length} file${
            selectedFiles.length > 1 ? "s" : ""
          } attached`;
          attachBtn.style.backgroundColor = "#374151";
        } else {
          attachBtn.title = "Attach Files";
          attachBtn.style.backgroundColor = "";
        }
      } else if (message.command === "clearWorkingStatus") {
        setWorkingState(false);
      }
    });

    // Expose API for external use
    window.inputAreaAPI = {
      setWorkingState,
    };

    // Add keyboard shortcut handling
    document.addEventListener("keydown", (e) => {
      // Ctrl+N for new chat
      if (e.ctrlKey && e.key === "n") {
        e.preventDefault();
        // Trigger new chat
        try {
          if (
            window.chatUI &&
            typeof window.chatUI.clearMessages === "function"
          ) {
            window.chatUI.clearMessages();
          }
          const vscode =
            typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : null;
          if (vscode) {
            vscode.postMessage({ command: "newChat" });
          }
        } catch (e) {
          console.error("New chat shortcut failed:", e);
        }
      }
    });
  })();
</script>
